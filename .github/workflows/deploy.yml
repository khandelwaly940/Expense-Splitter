name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed by gh-pages to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # package-lock.json is at the repo root (this repo IS the Expense app)
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run lint && npm test

      - name: Build
        env:
          # Proxy URL is hardcoded in source — this secret is optional.
          # Set it in GitHub Secrets only if you want to override the default.
          VITE_SHORTLINK_PROXY_URL: ${{ secrets.VITE_SHORTLINK_PROXY_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
